name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Format, lint, typecheck, tests
        run: npm run check

      - name: Package dry-run
        run: npm run pack:dry

      - name: Packed consumer Pi smoke
        run: npm run smoke:pi

      - name: Runtime audit (omit dev)
        run: npm audit --omit=dev --audit-level=high
